[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alarmkpi"
dynamic = ["version"]
description = "ISA-18.2 / EEMUA 191 alarm performance KPIs and a one-file HTML report from alarm journal exports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dan Shinde" }]
keywords = [
  "alarm-management", "isa-18.2", "eemua-191", "alarm-flood", "chattering-alarms", "scada",
  "hmi", "dcs", "ignition", "process-safety", "industrial", "automation", "kpi", "operator",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
alarmkpi = "alarmkpi.cli:main"

[project.urls]
Homepage = "https://github.com/DanShinde/alarmkpi"
Documentation = "https://github.com/DanShinde/alarmkpi#readme"
Issues = "https://github.com/DanShinde/alarmkpi/issues"
Changelog = "https://github.com/DanShinde/alarmkpi/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.version]
path = "src/alarmkpi/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]  # the formatter owns line length; × is intended

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["alarmkpi"]
mypy_path = "src"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
